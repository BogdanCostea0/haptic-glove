[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
; upload_port = COM3
; monitor_port = COM3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_deps =
    adafruit/Adafruit ADS1X15@^2.5.0
    hideakitai/MPU9250@^0.4.5
    adafruit/Adafruit DRV2605 Library@^1.2.2
